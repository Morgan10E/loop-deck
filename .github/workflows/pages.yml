name: Deploy to GitHub Pages

# Publishes the static site (repo root) to GitHub Pages.
# The configure-pages step enables Pages (GitHub Actions source) on first run,
# so no manual setup in repo settings is required.

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Allow the workflow to publish Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (with the GitHub Actions source) if it isn't already,
          # so the first run doesn't fail with "Get Pages site failed".
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The whole repo is the site; it's all static files at the root.
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
